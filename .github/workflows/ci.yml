# Builds the app and runs the tests, including the shared Android Auto rules in core/.
name: CI

on:
  push:
    branches: [master, optional-manifest-metadata]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build
        run: ./gradlew --no-daemon :core:test :patcher:testDebugUnitTest :patcher:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: carbridge-debug
          path: patcher/build/outputs/apk/debug/*.apk
