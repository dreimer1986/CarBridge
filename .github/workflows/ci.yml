# Builds the app and runs the tests, including the shared Android Auto rules in core/, then
# patches and signs a real APK and checks it with apksigner and aapt2.
name: CI

on:
  push:
    # dev too: Dev builds only run unit tests, not the real-APK and SDK tool checks
    branches: [master, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test and build
        run: ./gradlew --no-daemon :core:test :patcher:testDebugUnitTest :patcher:assembleDebug

      # CarBridge's own debug APK is a real app with providers and resources to patch
      - name: Patch, sign and verify a real APK
        run: >
          ./gradlew --no-daemon :patcher:testDebugUnitTest --tests '*patchesSignsAndVerifiesFixture*'
          -PpatchFixture="$PWD/patcher/build/outputs/apk/debug/patcher-debug.apk" -PpatchHeap=512m

      - name: Check the copy with the SDK's tools
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT=patcher/build/patch-test/base.apk
          "$BT/apksigner" verify --print-certs "$OUT"
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$OUT" > manifest.txt
          for want in org.carbridge.debug.car android.intent.category.CAR_LAUNCHER \
                      com.google.android.gms.car.application; do
            grep -q "$want" manifest.txt || { echo "Missing from manifest: $want"; exit 1; }
          done
